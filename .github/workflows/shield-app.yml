name: Build Shield app
on:
  push:
    paths: ['android/**', '.github/workflows/shield-app.yml']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk boxtile.apk
      - name: Publish download
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view shield >/dev/null 2>&1 || gh release create shield --title "Boxtile for Shield" --notes "Sideload boxtile.apk on an Android TV device."
          gh release upload shield boxtile.apk --clobber
