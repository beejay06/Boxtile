<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxtile</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#1d1b2f;color:#fff;font-family:system-ui,sans-serif;text-align:center}
h1{margin:.3em 0}
button,input,select{font:inherit;border-radius:12px;border:0;padding:.6em .9em}
button,select{background:#4a4670;color:#fff;cursor:pointer}button.on{background:#7c5cff}button:disabled{opacity:.35}
.board{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.cell{fill:#38345a}.cell.cup{fill:#FAC775}.cell.hot{fill:#7c5cff;cursor:pointer}
.emoji{text-anchor:middle;dominant-baseline:central}
.lost{stroke:#E24B4A;stroke-width:14;stroke-linecap:round}
.tv{font-size:2.2vmin}
.tv :focus{outline:.6vmin solid #FFC83D;outline-offset:.3vmin}
.logo{width:1.8em;height:1.8em;border-radius:.35em;vertical-align:middle;margin-right:.3em}.phone #join>.logo{width:84px;height:84px;margin:0}
#menu{max-width:420px;margin:auto;padding:24px 14px}.logo.big{width:120px;height:120px;margin:0}#mjoin input{text-align:center}#dqr{width:200px;height:200px;margin:10px auto;background:#fff;border-radius:10px}#dqr svg{width:100%;height:100%}#invite{margin:10px 0}
#dlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.watch #side .chip{font-size:1em}#watchform input{width:9em;text-align:center}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.slots .chip{font-size:1.1em}.chip.empty{background:none;outline:2px dashed #6b66a0;color:#aaa6cc}.count{width:100%}
#music{position:fixed;right:8px;bottom:8px;z-index:2;width:240px;font-size:13px;background:#2b2845;border-radius:12px;padding:6px}
#source{width:100%;padding:.4em;margin-bottom:4px}#rsong{margin:6px 0;overflow-wrap:anywhere}.mrow{display:flex;gap:4px;justify-content:center;margin-bottom:6px}
#ytwrap{height:200px;background:#000}#ytwrap iframe{display:block;width:100%;height:200px}
#song{margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mbuttons,#musicform{display:flex;gap:4px;justify-content:center}#music button{padding:.4em .7em}#murl{min-width:0;flex:1;padding:.4em}
.has-music #lobby{padding-right:256px}
#tunes{margin:14px 0}#tune{margin-bottom:6px}
#lobby{display:flex;flex-direction:column;align-items:center;gap:1.6vmin;padding:2vmin}
#qr{width:28vmin;height:28vmin;background:#fff;border-radius:2vmin}#qr svg{width:100%;height:100%}
#code{font-size:6vmin;letter-spacing:.2em;font-weight:800}
#settings,#joined{display:flex;flex-wrap:wrap;justify-content:center;gap:1em;min-height:2.5em}
.chip{background:#38345a;padding:.4em .8em;border-radius:99px;font-size:1.3em}
#play{display:flex;gap:4vmin;height:100vh;padding:3vmin;justify-content:center;align-items:center}
#tvboard{width:94vmin;height:94vmin}
#side{width:42vmin;display:flex;flex-direction:column;gap:1.4vmin}
#banner{font-size:1.8em;font-weight:800}
.row{display:flex;justify-content:space-between;gap:.5em;background:#2b2845;padding:.6em;border-radius:12px;border-left:1.2vmin solid}.row.now{background:#4a4670}
.phone{font-size:17px}#phone{max-width:480px;margin:auto;padding:12px}
#join input,#cat{width:100%;margin-bottom:8px}
#emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}.pick{font-size:27px;padding:6px 0}
#colors{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 14px}.swatch,.swatch.on{height:48px;color:#000;font-weight:800}.swatch.on{outline:4px solid #fff}.swatch:disabled{opacity:.15}
#pboard{width:100%;aspect-ratio:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid button{touch-action:none;user-select:none;-webkit-user-select:none}
i.bar-h,i.bar-v{display:block;margin:0 auto 4px;border-radius:4px;pointer-events:none;width:56px;height:8px}i.bar-v{width:8px;height:28px}
.wide{width:100%;margin:6px 0}
#note{color:#ffd166;min-height:1.4em}
.tv{--sw:max(36vmin,min(100vw - 104vmin,80vmin));--mh:0px}
.tv #play{padding:3vmin 0;gap:4vmin}
.tv #side{width:var(--sw);height:94vmin;max-height:calc(94vmin - var(--mh) - 2vmin);align-self:flex-start;overflow:auto;gap:1.2vmin}
.tv #banner{font-size:4.6vmin}.tv #list{display:flex;flex-direction:column;gap:.8vmin}
.tv #side .row{font-size:2.8vmin;padding:.3em .6em}.tv #side button{font-size:2.6vmin;padding:.45em}
.tv #play:not([hidden]) ~ #music{left:calc(50vw - (98vmin + var(--sw))/2 + 98vmin);right:auto;width:var(--sw);bottom:3vmin;box-sizing:border-box;font-size:2.6vmin;padding:1.2vmin}
.tv #play:not([hidden]) ~ #music button,.tv #play:not([hidden]) ~ #music select{font-size:2.6vmin}
.tv #play:not([hidden]) ~ #music #playerbox:not([hidden]){display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,1fr);gap:8px;align-items:center}
.tv #play:not([hidden]) ~ #music #ytwrap{grid-row:span 2}.tv #play:not([hidden]) ~ #music #mbuttons{flex-wrap:wrap}
.tv #play:not([hidden]) ~ #music #song{white-space:normal}
.tv #play:has(~ #music #playerbox:not([hidden])) #list:has(> :nth-child(7)){display:grid;grid-template-columns:1fr 1fr}
.tv #play:has(~ #music #playerbox:not([hidden])) #list:has(> :nth-child(7)) .row{flex-direction:column;align-items:flex-start;gap:0;font-size:2.3vmin;padding:.15em .5em}
#pmusic{background:#2b2845;border-radius:12px;padding:8px;margin:12px 0}#psong{margin-bottom:6px;overflow-wrap:anywhere}#pmusic button{flex:1;font-size:22px}
#remote{display:flex;align-items:center;gap:8px}#rinfo{flex:1;min-width:0}
#rart{width:84px;height:84px;flex:none;border-radius:8px;object-fit:cover}
.tv #play:not([hidden]) ~ #music #rart{width:22vmin;height:22vmin}
#part{display:block;width:120px;height:120px;margin:0 auto 8px;border-radius:10px;object-fit:cover}
.tv #list:has(> :nth-child(7)) .row{padding:.08em .6em}.tv #side:has(#list > :nth-child(7)){gap:.8vmin}
</style></head><body>
<main id="tv" hidden>
  <section id="lobby">
    <h1><img class="logo" src="icon-192.png" alt="">Boxtile</h1>
    <div>Wall them in. Take the trophy.</div>
    <div>Scan with your phone to join</div>
    <div id="qr"></div>
    <div id="code"></div>
    <div id="settings">
      <select id="board" aria-label="Board"><option value="9">Square 9x9</option><option value="13">Square 13x13</option><option value="hex">Honeycomb</option></select>
      <select id="layout" aria-label="Starting layout"><option value="spread">Spread starts</option><option value="star">Star starts</option></select>
      <select id="size" aria-label="Number of players"><option value="2">2 players</option><option value="4">4 players</option><option value="5">5 players</option><option value="6">6 players</option><option value="8">8 players</option></select>
      <select id="cpus" aria-label="Computer players"><option value="0">No computers</option><option value="1">1 computer</option><option value="2">2 computers</option><option value="3">3 computers</option><option value="4">4 computers</option><option value="5">5 computers</option><option value="6">6 computers</option><option value="7">7 computers</option></select>
    </div>
    <div id="joined"></div>
    <div><button id="start" class="on" disabled></button> <button id="clear">Clear players</button></div>
    <div id="status"></div>
    <button id="duolink">Phones only, no TV</button>
    <form id="watchform"><input id="wcode" maxlength="4" placeholder="Game code" required> <button>Watch a game</button></form>
  </section>
  <section id="play" hidden>
    <div id="tvboard"></div>
    <div id="side"><div id="banner"></div><button id="go" class="on">Start game</button><button id="again" class="on">Rematch</button><div id="list"></div><small id="rejoin"></small><button id="reset">End game</button></div>
  </section>
  <aside id="music">
    <select id="source" aria-label="Music">
      <option value="">🎵 Music: off</option><option value="spotify">Spotify</option><option value="tidal">TIDAL</option>
      <option value="ytmusic">YouTube Music</option><option value="apple">Apple Music</option><option value="link">YouTube link (plays here)</option>
    </select>
    <div id="remote" hidden>
      <img id="rart" alt="Album cover" hidden>
      <div id="rinfo">
      <div id="rsong" aria-live="polite">Nothing playing yet</div>
      <div class="mrow"><button id="rprev" aria-label="Previous song">⏮</button><button id="rpp" aria-label="Play or pause">⏯</button><button id="rnext" aria-label="Next song">⏭</button></div>
      <button id="openapp"></button> <button id="access" hidden>Show song names</button>
    </div>
    </div>
    <div id="elsewhere" hidden></div>
    <div id="playerbox" hidden>
      <div id="ytwrap"><div id="yt"></div></div>
      <div id="song" aria-live="polite"></div>
      <div id="mbuttons"><button id="prev" aria-label="Previous song">⏮</button><button id="pp" aria-label="Play or pause">▶</button><button id="next" aria-label="Next song">⏭</button><button id="change">Change</button></div>
    </div>
    <form id="musicform" hidden><input id="murl" placeholder="🎵 Paste YouTube link" aria-label="YouTube or YouTube Music link"><button>Play</button></form>
  </aside>
</main>
<main id="menu" hidden>
  <img class="logo big" src="icon-192.png" alt=""><h1>Boxtile</h1>
  <button id="mduo" class="on wide">1. Phones only, no TV</button>
  <button id="mtv" class="wide">2. Use this screen as the TV</button>
  <form id="mjoin"><input id="mcode" class="wide" maxlength="4" placeholder="Game code" autocapitalize="characters" required><button class="wide">Join with code</button></form>
  <button id="mwatch" class="wide">Watch with code</button>
</main>
<main id="phone" hidden>
  <div id="note"></div>
  <section id="invite" hidden>
    <div id="share">
      <p>Invite players, and keep this screen open.</p>
      <button id="copy" class="on wide">Share invite link</button>
      <div id="dqr"></div>
      <div>Code <b id="dcode"></b></div>
      <button id="copywatch" class="wide">Share watch-only link (TV or laptop)</button>
    </div>
    <div><select id="dboard" aria-label="Board"><option value="9">Square 9x9</option><option value="13">Square 13x13</option><option value="hex">Honeycomb</option></select>
    <select id="dlayout" aria-label="Starting layout"><option value="spread">Spread starts</option><option value="star">Star starts</option></select>
    <select id="dsize" aria-label="Number of players"></select>
    <select id="dcpus" aria-label="Computer players"></select></div>
    <div id="dlist"></div>
    <div id="status2"></div>
    <button id="quit" class="wide">Leave game</button>
  </section>
  <form id="join" hidden>
    <img class="logo" src="icon-192.png" alt="Boxtile">
    <h1>Join the game</h1>
    <input id="name" maxlength="12" placeholder="Your screen name" required>
    <select id="cat" aria-label="Emoji category"></select>
    <div id="emojis"></div>
    <p id="chosen"></p>
    <p>Pick your color</p>
    <div id="colors"></div>
    <button id="joinbtn" class="on wide">Join</button>
  </form>
  <section id="wait" hidden><h1 id="me"></h1><div id="wslots"></div><button id="pstart" class="on wide"></button><button id="leave" class="wide">Change name or emoji</button></section>
  <section id="ctrl" hidden>
    <h2 id="turn"></h2>
    <div id="pboard"></div>
    <p id="hint"></p>
    <button id="pgo" class="on wide">Start game</button>
    <button id="pagain" class="on wide">Rematch</button>
    <div id="tools"><div class="grid"><button id="wh"></button><button id="wv"></button><button id="cancel">Cancel wall</button><button id="place">Place wall</button></div></div>
    <div id="walls"></div>
    <small id="pcode"></small>
    <button id="pend" class="wide" hidden>End game</button>
  </section>
  <section id="pmusic" hidden>
    <img id="part" alt="Album cover" hidden>
    <div id="psong" aria-live="polite"></div>
    <div class="mrow"><button id="pprev" aria-label="Previous song">⏮</button><button id="ppp" aria-label="Play or pause">⏯</button><button id="pnext" aria-label="Next song">⏭</button></div>
  </section>
  <details id="tunes" hidden><summary>🎵 Send music to the screen</summary>
    <form id="tuneform"><input id="tune" class="wide" placeholder="Paste YouTube or YouTube Music link" required><button class="wide">Send</button></form>
  </details>
</main>
<!--SCRIPTS-->
</body></html>
